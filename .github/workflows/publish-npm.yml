name: Publish verified npm candidate
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      package_artifact:
        required: true
        type: string
      candidate_receipt:
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_artifact }}
          path: package
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_receipt }}
          path: candidate
      - name: Verify protected candidate receipt and npm configuration
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          tarball="$(node scripts/assert-one-tarball.mjs package)"
          node --input-type=module - "$tarball" <<'NODE'
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const tarball = process.argv[2];
          const receipt = JSON.parse(
            readFileSync("candidate/release-candidate-receipt.json"),
          );
          const verification = JSON.parse(
            readFileSync("package/package-verification.json"),
          );
          const pkg = JSON.parse(
            execFileSync("tar", ["-xOf", tarball, "package/package.json"]),
          );
          const integrity = `sha512-${createHash("sha512")
            .update(readFileSync(tarball)).digest("base64")}`;
          const hardware = new Set(
            (receipt.e2eReceipts ?? []).map(({ host }) => host),
          );
          if (receipt.sourceSha !== process.env.SOURCE_SHA ||
              receipt.tag !== process.env.TAG ||
              verification.binVersion !== pkg.version ||
              receipt.version !== pkg.version ||
              receipt.tag !== `v${pkg.version}` ||
              integrity !== verification.integrity ||
              receipt.e2eReceipts?.length !== 3 ||
              !["macos-arm64", "ubuntu-amd64-kvm", "ubuntu-arm64-kvm"]
                .every((host) => hardware.has(host)) ||
              receipt.e2eReceipts.some((item) =>
                item.status !== "passed" || !item.passedAt ||
                item.packageVersion !== pkg.version ||
                item.cleanup?.status !== "passed" ||
                item.cleanup?.homeRemoved !== true) ||
              receipt.runtimeReceipt?.variant !== "standard" ||
              receipt.runtimeReceipt?.indexDigest !== receipt.imageDigest ||
              receipt.freshInstallReceipt?.sourceSha !==
                process.env.SOURCE_SHA ||
              receipt.freshInstallReceipt?.version !== pkg.version ||
              receipt.freshInstallReceipt?.integrity !==
                verification.integrity ||
              !receipt.freshInstallReceipt?.cleanup?.packageRemoved ||
              !receipt.freshInstallReceipt?.cleanup?.prefixRemoved ||
              !receipt.freshInstallReceipt?.cleanup?.piHomeRemoved ||
              receipt.tarballIntegrity !== verification.integrity ||
              receipt.tarballIntegrity !== integrity ||
              pkg.version.includes("-"))
            throw new Error("npm candidate receipt is invalid");
          NODE
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          echo "tarball=$tarball" >> "$GITHUB_ENV"
      - name: Detect an immutable existing npm version
        id: registry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          exact="pi-docker-sandboxes@${TAG#v}"
          if npm view "$exact" version --json \
            > "$RUNNER_TEMP/npm-version.json" \
            2> "$RUNNER_TEMP/npm-version.err"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$RUNNER_TEMP/npm-version.err"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-version.err" >&2
            exit 1
          fi
      - name: Publish the verified release tarball when absent
        if: steps.registry.outputs.present == 'false'
        run: npm publish "$tarball" --provenance --access public --tag latest
      - name: Retrieve and cryptographically verify npm provenance
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          exact="pi-docker-sandboxes@$version"
          evidence="$RUNNER_TEMP/npm-provenance"
          mkdir "$evidence"
          for attempt in $(seq 1 20); do
            if npm view "$exact" --json > "$evidence/package.json" &&
              npm view pi-docker-sandboxes dist-tags --json \
                > "$evidence/dist-tags.json" &&
              node --input-type=module - "$evidence" <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const root = process.argv[2];
          const metadata = JSON.parse(await readFile(`${root}/package.json`));
          metadata.distTags = JSON.parse(
            await readFile(`${root}/dist-tags.json`),
          );
          const url = new URL(metadata.dist?.attestations?.url);
          if (url.protocol !== "https:" ||
              url.hostname !== "registry.npmjs.org" ||
              !url.pathname.startsWith("/-/npm/v1/attestations/"))
            throw new Error("invalid npm attestation URL");
          const response = await fetch(url);
          if (!response.ok)
            throw new Error(`attestations HTTP ${response.status}`);
          await writeFile(
            `${root}/registry-metadata.json`,
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          await writeFile(`${root}/attestations.json`, await response.text());
          NODE
            then
              break
            fi
            test "$attempt" -lt 20 || exit 1
            sleep 15
          done
          audit="$RUNNER_TEMP/npm-audit"
          mkdir "$audit"
          printf '%s\n' \
            '{"name":"npm-provenance-audit","version":"0.0.0"}' \
            > "$audit/package.json"
          (
            cd "$audit"
            npm install --save-exact --ignore-scripts --omit=peer "$exact"
            npm audit signatures --json \
              > "$evidence/npm-audit-signatures.json"
          )
          cp "$audit/package-lock.json" "$evidence/audited-package-lock.json"
          node scripts/verify-npm-provenance.mjs \
            "$evidence/registry-metadata.json" \
            "$evidence/attestations.json" \
            candidate/release-candidate-receipt.json \
            package/package-verification.json \
            "$evidence/verified-provenance.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-provenance-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/npm-provenance
          if-no-files-found: error
          retention-days: 90
