name: Docker Sandboxes E2E
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to test
        required: true
        type: string
      package_artifact:
        description: Artifact containing the verified npm tarball and receipt
        required: true
        type: string
      runtime_artifact:
        description: Artifact containing verified production runtime receipts
        required: true
        type: string
      runtime_reference:
        description: Exact public standard runtime digest reference
        required: true
        type: string
      image_digest:
        description: OCI manifest digest bound to the candidate receipt
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit to test
        required: true
        type: string
      package_artifact:
        description: Artifact name, normally npm-package-<source_sha>
        required: true
        type: string
      runtime_artifact:
        description: Artifact containing verified production runtime receipts
        required: true
        type: string
      runtime_reference:
        description: Exact public standard runtime digest reference
        required: true
        type: string
      image_digest:
        description: OCI manifest digest bound to the candidate receipt
        required: true
        type: string
      run_id:
        description: Completed CI run that uploaded the package artifact
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  hardware-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner:
              - self-hosted
              - macOS
              - ARM64
              - docker-sandboxes
              - ephemeral
            platform: linux/arm64
            host-platform: darwin
            host-arch: arm64
            requires-kvm: false
          - name: ubuntu-amd64-kvm
            runner:
              - self-hosted
              - Linux
              - X64
              - docker-sandboxes
              - kvm
              - ephemeral
            platform: linux/amd64
            host-platform: linux
            host-arch: x64
            requires-kvm: true
          - name: ubuntu-arm64-kvm
            runner:
              - self-hosted
              - Linux
              - ARM64
              - docker-sandboxes
              - kvm
              - ephemeral
            platform: linux/arm64
            host-platform: linux
            host-arch: arm64
            requires-kvm: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      HOME: >-
        /tmp/pi-dsbx-${{ github.run_id }}-${{ strategy.job-index }}-home
      PI_DOCKER_SANDBOX_E2E_SYNTHETIC_AUTH: "1"
      OPENAI_API_KEY: task10-synthetic-not-a-provider-credential
    steps:
      - name: Initialize isolated runner state
        run: |
          set -euo pipefail
          rm -rf "$HOME"
          mkdir -m 700 "$HOME"
          echo "PI_CODING_AGENT_DIR=$HOME/.pi/agent" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/pi-dsbx-e2e.log"
          : > "$RUNNER_TEMP/e2e-sandboxes.txt"
          printf '{"status":"failed","removed":[]}\n' \
            > "$RUNNER_TEMP/cleanup-receipt.json"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download called-workflow package artifact
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_artifact }}
          path: ${{ runner.temp }}/pi-dsbx-e2e-artifact
      - name: Download dispatched package artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_artifact }}
          path: ${{ runner.temp }}/pi-dsbx-e2e-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Download called-workflow production runtime evidence
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.runtime_artifact }}
          path: ${{ runner.temp }}/pi-dsbx-e2e-runtime
      - name: Download dispatched production runtime evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.runtime_artifact }}
          path: ${{ runner.temp }}/pi-dsbx-e2e-runtime
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Pull and bind the exact published standard runtime
        id: image
        env:
          EXPECTED_DIGEST: ${{ inputs.image_digest }}
          RUNTIME_ARTIFACT_NAME: ${{ inputs.runtime_artifact }}
          RUNTIME_EVIDENCE: ${{ runner.temp }}/pi-dsbx-e2e-runtime
          RUNTIME_REFERENCE: ${{ inputs.runtime_reference }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test "$RUNTIME_ARTIFACT_NAME" = "production-runtime-$SOURCE_SHA"
          test "$RUNTIME_REFERENCE" = "${RUNTIME_REFERENCE%@*}@$EXPECTED_DIGEST"
          receipt="$RUNTIME_EVIDENCE/runtime-image-receipt.json"
          test -s "$receipt"
          node --input-type=module - "$receipt" <<'NODE'
          import { readFile } from "node:fs/promises";
          const receipt = JSON.parse(await readFile(process.argv[2]));
          if (receipt.variant !== "standard" ||
              receipt.indexDigest !== process.env.EXPECTED_DIGEST ||
              receipt.candidateReference !== process.env.RUNTIME_REFERENCE)
            throw new Error("published runtime receipt mismatch");
          NODE
          docker pull --platform "$PLATFORM" "$RUNTIME_REFERENCE"
          image_id="$(docker image inspect "$RUNTIME_REFERENCE" \
            --format '{{.Id}}')"
          content="${image_id#sha256:}"
          selected="docker.io/pi-docker-sandboxes/pi:local-$content"
          docker tag "$image_id" "$selected"
          docker save --output "$RUNTIME_EVIDENCE/sbx-runtime.tar" "$selected"
          sbx template load "$RUNTIME_EVIDENCE/sbx-runtime.tar"
          sbx template ls --json > "$RUNTIME_EVIDENCE/templates.json"
          template_store_id="$(node --input-type=module - \
            "$RUNTIME_EVIDENCE/templates.json" "$selected" <<'NODE'
          import { readFile } from "node:fs/promises";
          const [path, selected] = process.argv.slice(2);
          const separator = selected.lastIndexOf(":");
          const repository = selected.slice(0, separator);
          const tag = selected.slice(separator + 1);
          const templates = JSON.parse(await readFile(path));
          const matches = (templates.images ?? []).filter(
            (image) => image.repository === repository && image.tag === tag,
          );
          if (matches.length !== 1) process.exit(1);
          if (!/^[a-f0-9]{12,}$/.test(matches[0]?.id ?? "")) process.exit(1);
          console.log(matches[0].id);
          NODE
          )"
          {
            echo "candidate_digest=$EXPECTED_DIGEST"
            echo "selected_image=$selected"
            echo "selected_image_id=$image_id"
            echo "template_store_id=$template_store_id"
          } >> "$GITHUB_OUTPUT"
      - name: Bind candidate inputs and install in a clean prefix
        id: candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          E2E_PREFIX: ${{ runner.temp }}/pi-dsbx-e2e-prefix
          E2E_ARTIFACT: ${{ runner.temp }}/pi-dsbx-e2e-artifact
          E2E_LOG: ${{ runner.temp }}/pi-dsbx-e2e.log
        run: |
          set -euo pipefail
          exec > >(tee -a "$E2E_LOG") 2>&1
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          expected_artifact="npm-package-$SOURCE_SHA"
          test "${{ inputs.package_artifact }}" = "$expected_artifact"
          tarball="$(node scripts/assert-one-tarball.mjs "$E2E_ARTIFACT")"
          test -f "$E2E_ARTIFACT/package-verification.json"
          rm -rf "$E2E_PREFIX"
          mkdir -p "$E2E_PREFIX"
          npm install --ignore-scripts --prefix "$E2E_PREFIX" "$tarball"
          receipt="$E2E_ARTIFACT/package-verification.json"
          node --input-type=module - "$receipt" <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const receipt = JSON.parse(await readFile(process.argv[2], "utf8"));
          if (!receipt.integrity || !receipt.binVersion) process.exit(1);
          console.log(`integrity=${receipt.integrity}`);
          console.log(`package_version=${receipt.binVersion}`);
          NODE
          test "${{ steps.image.outputs.candidate_digest }}" = "$IMAGE_DIGEST"
          installed_root="$E2E_PREFIX/node_modules/pi-docker-sandboxes"
          installed="$installed_root/package.json"
          node --input-type=module - "$E2E_PREFIX" "$installed_root" <<'NODE'
          import { realpath } from "node:fs/promises";
          import { isAbsolute, relative, sep } from "node:path";
          const prefix = await realpath(process.argv[2]);
          const root = await realpath(process.argv[3]);
          const pathFromPrefix = relative(prefix, root);
          if (pathFromPrefix === ".." ||
              pathFromPrefix.startsWith(`..${sep}`) ||
              isAbsolute(pathFromPrefix))
            throw new Error(
              "installed package root is outside isolated prefix",
            );
          NODE
          {
            printf 'tarball=%s\n' "$tarball"
            printf 'installed_package=%s\n' "$installed"
            printf 'installed_package_root=%s\n' "$installed_root"
          } >> "$GITHUB_OUTPUT"
      - name: Run complete real E2E
        id: e2e
        env:
          E2E_PREFIX: ${{ runner.temp }}/pi-dsbx-e2e-prefix
          E2E_LOG: ${{ runner.temp }}/pi-dsbx-e2e.log
          PI_DOCKER_SANDBOX_E2E: "1"
          PI_DOCKER_SANDBOX_E2E_IMAGE: >-
            ${{ steps.image.outputs.selected_image }}
          PI_DOCKER_SANDBOX_E2E_TEMPLATE_STORE_ID: >-
            ${{ steps.image.outputs.template_store_id }}
          PI_DOCKER_SANDBOX_E2E_NAMES: >-
            ${{ runner.temp }}/e2e-sandboxes.txt
          PI_DOCKER_SANDBOX_E2E_PACKAGE: ${{ steps.candidate.outputs.tarball }}
          PI_DOCKER_SANDBOX_E2E_PACKAGE_VERSION: >-
            ${{ steps.candidate.outputs.package_version }}
          PI_DOCKER_SANDBOX_E2E_PACKAGE_ROOT: >-
            ${{ steps.candidate.outputs.installed_package_root }}
          PI_DOCKER_SANDBOX_E2E_RUNTIME_RECEIPT: >-
            ${{ runner.temp }}/sandbox-runtime-receipt.json
        run: |
          export PATH="$E2E_PREFIX/node_modules/.bin:$PATH"
          test "$PI_DOCKER_SANDBOX_E2E_SYNTHETIC_AUTH" = 1
          npm run test:e2e 2>&1 | tee -a "$E2E_LOG"
      - name: Write artifact-bound E2E receipt
        if: always()
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          SELECTED_IMAGE: ${{ steps.image.outputs.selected_image }}
          SELECTED_IMAGE_ID: ${{ steps.image.outputs.selected_image_id }}
          CANDIDATE_DIGEST: ${{ steps.image.outputs.candidate_digest }}
          PACKAGE_INTEGRITY: ${{ steps.candidate.outputs.integrity }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.package_version }}
          TARBALL: ${{ steps.candidate.outputs.tarball }}
          INSTALLED_PACKAGE: ${{ steps.candidate.outputs.installed_package }}
          E2E_RECEIPT: ${{ runner.temp }}/e2e-receipt.json
          RUNTIME_RECEIPT: >-
            ${{ runner.temp }}/sandbox-runtime-receipt.json
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          KVM_REQUIRED: ${{ matrix.requires-kvm }}
        run: |
          count="$(grep -c 'E2E_TEST_PASSED=1' \
            "$RUNNER_TEMP/pi-dsbx-e2e.log" || true)"
          if test "$E2E_OUTCOME" = success && test "$count" -eq 6; then
            status=passed
          else
            status=failed
          fi
          docker_version="$(docker version \
            --format '{{.Server.Version}}' || true)"
          sbx_version="$(sbx --version | awk '{print $NF}' || true)"
          sbx_version="${sbx_version#v}"
          pi_version=""
          image_lock_pi_version=""
          if test -s "$RUNTIME_RECEIPT" && test -n "$INSTALLED_PACKAGE"; then
            installed_root="$(dirname "$INSTALLED_PACKAGE")"
            pi_version="$(node -p \
              'require(process.argv[1]).piVersion' \
              "$RUNTIME_RECEIPT" 2>/dev/null || true)"
            image_lock_pi_version="$(node -p \
              'require(process.argv[1]).piVersion' \
              "$installed_root/docker/image-lock.json" 2>/dev/null || true)"
            runtime_lock_pi_version="$(node -p \
              'require(process.argv[1]).imageLockPiVersion' \
              "$RUNTIME_RECEIPT" 2>/dev/null || true)"
            if test "$runtime_lock_pi_version" != "$image_lock_pi_version"; then
              image_lock_pi_version=""
            fi
          fi
          if command -v sw_vers >/dev/null 2>&1; then
            host_version="$(sw_vers -productVersion)"
          else
            host_version="$(uname -r)"
          fi
          set +e
          node scripts/e2e-receipt.mjs \
            --source-sha "$SOURCE_SHA" \
            --package "$TARBALL" \
            --package-integrity "$PACKAGE_INTEGRITY" \
            --package-version "$PACKAGE_VERSION" \
            --installed-package "$INSTALLED_PACKAGE" \
            --image-digest "$SELECTED_IMAGE_ID" \
            --selected-image "$SELECTED_IMAGE" \
            --selected-image-id "$SELECTED_IMAGE_ID" \
            --status "$status" \
            --tests-count "$count" \
            --expected-platform "${{ matrix.host-platform }}" \
            --host-version "$host_version" \
            --expected-architecture "${{ matrix.host-arch }}" \
            --require-kvm "${{ matrix.requires-kvm }}" \
            --docker-version "$docker_version" \
            --sbx-version "$sbx_version" \
            --pi-version "$pi_version" \
            --image-lock-pi-version "$image_lock_pi_version" \
            --receipt "$E2E_RECEIPT" \
            --test "Pi diagnostics, clone, daemon, and network boundaries" \
            --test "binary patch round trip and host staging cleanup" \
            --test "preserve, export, discard, and signal recovery" \
            --test "empty Git onboarding" \
            --test "installed extension re-exec" \
            --test "proxy credential secrecy and no-model guidance"
          receipt_status=$?
          set -e
          if test "$receipt_status" -eq 0; then
            node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = process.env.E2E_RECEIPT;
          const receipt = JSON.parse(await readFile(path));
          receipt.candidateDigest = process.env.CANDIDATE_DIGEST || null;
          receipt.imageDigest = receipt.candidateDigest;
          await writeFile(path, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          fi
          if test ! -s "$E2E_RECEIPT"; then
            node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const receipt = {
            sourceSha: process.env.SOURCE_SHA,
            packageIntegrity: process.env.PACKAGE_INTEGRITY || null,
            imageDigest: process.env.IMAGE_DIGEST,
            selectedImage: process.env.SELECTED_IMAGE || null,
            platform: process.platform,
            hostVersion: null,
            architecture: process.arch,
            kvm: {
              required: process.env.KVM_REQUIRED === "true",
              path: process.env.KVM_REQUIRED === "true" ? "/dev/kvm" : null,
              characterDevice: false,
              opened: false,
              openMode: process.env.KVM_REQUIRED === "true" ? "r+" : null,
            },
            dockerVersion: null,
            sbxVersion: null,
            piVersion: null,
            imageLockPiVersion: null,
            packageVersion: process.env.PACKAGE_VERSION || null,
            tests: ["E2E receipt generation"],
            testsCount: 0,
            status: "failed",
            passedAt: null,
          };
          await writeFile(
            process.env.E2E_RECEIPT,
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE
          fi
          exit "$receipt_status"
      - name: Clean only sandboxes recorded by this run
        if: always()
        env:
          E2E_NAMES: ${{ runner.temp }}/e2e-sandboxes.txt
          CLEANUP_RECEIPT: ${{ runner.temp }}/cleanup-receipt.json
        run: |
          failures="$RUNNER_TEMP/e2e-cleanup-failures"
          removed="$RUNNER_TEMP/e2e-cleanup-removed"
          : > "$failures"
          : > "$removed"
          sort -u "$E2E_NAMES" | while IFS= read -r name; do
            test -n "$name" || continue
            case "$name" in
              pi-dsbx-e2e-*|pi-dsbx-reexec-*|pi-dsbx-proxy-*)
                if sbx rm --force "$name"; then
                  printf '%s\n' "$name" >> "$removed"
                else
                  printf '%s\n' "$name" >> "$failures"
                fi
                ;;
              *)
                echo "refusing to clean unrecognized sandbox: $name" >&2
                printf '%s\n' "$name" >> "$failures"
                ;;
            esac
          done
          rm -rf "$HOME"
          HOME_REMOVED=1 REMOVED="$removed" FAILURES="$failures" \
            RECEIPT="$CLEANUP_RECEIPT" node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const lines = async (path) => (await readFile(path, "utf8"))
            .split("\n").filter(Boolean);
          const failures = await lines(process.env.FAILURES);
          await writeFile(process.env.RECEIPT, `${JSON.stringify({
            status: failures.length ? "failed" : "passed",
            removed: await lines(process.env.REMOVED),
            homeRemoved: process.env.HOME_REMOVED === "1",
            failures,
          }, null, 2)}\n`);
          NODE
          if test -s "$failures"; then
            echo "E2E cleanup failed:" >&2
            cat "$failures" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ matrix.name }}-e2e-${{ inputs.source_sha }}
          path: |
            ${{ runner.temp }}/pi-dsbx-e2e.log
            ${{ runner.temp }}/e2e-receipt.json
            ${{ runner.temp }}/sandbox-runtime-receipt.json
            ${{ runner.temp }}/cleanup-receipt.json
          if-no-files-found: error
          retention-days: 14
