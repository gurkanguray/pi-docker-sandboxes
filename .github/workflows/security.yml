name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  filesystem:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Upload filesystem scan
        if: always()
        uses: >-
          github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

  public-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: runtime
        name: Read exact published standard runtime lock
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const image = JSON.parse(
            await readFile("docker/image-lock.json"),
          ).images?.standard;
          const evidence = JSON.parse(
            await readFile("docker/runtime-release-lock.json"),
          );
          if (image?.status !== "published" || evidence?.version !== 1)
            throw new Error("public standard runtime is not locked");
          console.log(`reference=${image.reference}`);
          console.log(`run_id=${evidence.runId}`);
          console.log(`receipt_artifact=${evidence.receiptArtifact}`);
          console.log(
            `security_pattern=security-*-standard-${evidence.runId}-${evidence.runAttempt}`,
          );
          NODE
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.runtime.outputs.receipt_artifact }}
          path: runtime
          github-token: ${{ github.token }}
          run-id: ${{ steps.runtime.outputs.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ steps.runtime.outputs.security_pattern }}
          path: runtime/evidence
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.runtime.outputs.run_id }}
      - name: Verify locked receipts and raw publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: |
          set -euo pipefail
          node scripts/verify-production-runtime.mjs \
            docker/image-lock.json docker/runtime-release-lock.json \
            runtime/runtime-image-receipt.json runtime/evidence \
            runtime/production-runtime-verification.json
          gh attestation verify "oci://$RUNTIME_REFERENCE" \
            --repo "$GITHUB_REPOSITORY"
      - name: Pull exact public platform manifest
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          RUNTIME_PLATFORM: linux/${{ matrix.arch }}
        run: docker pull --platform "$RUNTIME_PLATFORM" "$RUNTIME_REFERENCE"
      - id: scan
        name: Scan exact public standard runtime
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: ${{ steps.runtime.outputs.reference }}
          format: sarif
          output: runtime-standard-${{ matrix.arch }}.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Generate exact public standard runtime CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          image-ref: ${{ steps.runtime.outputs.reference }}
          format: cyclonedx
          output: runtime-standard-${{ matrix.arch }}.cdx.json
      - name: Upload public runtime scan
        if: always() && steps.scan.outcome != 'cancelled'
        uses: >-
          github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        with:
          sarif_file: runtime-standard-${{ matrix.arch }}.sarif
          category: public-runtime-standard-${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.scan.outcome != 'cancelled'
        with:
          name: public-runtime-security-${{ matrix.arch }}-${{ github.sha }}
          path: |
            runtime-standard-${{ matrix.arch }}.sarif
            runtime-standard-${{ matrix.arch }}.cdx.json
            runtime/production-runtime-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce exact public runtime scan
        if: steps.scan.outcome == 'failure'
        run: exit 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: >-
          github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e
