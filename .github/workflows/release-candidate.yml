name: Protected release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          key=docs/release-signing.asc
          export GNUPGHOME="$RUNNER_TEMP/release-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          test -s "$key" || {
            echo "missing committed release signing key: $key" >&2
            exit 1
          }
          gpg --batch --import "$key"
          test -n "$(gpg --batch --with-colons --list-keys \
            | awk -F: '$1 == "pub" { print $5; exit }')"
          git verify-tag "$TAG"
          test "$(git cat-file -t "$TAG")" = tag
          sha="$(git rev-list -n 1 "$TAG")"
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          test "$sha" = "$(git rev-parse refs/remotes/origin/main)"
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_SHA" = "$sha"
          git checkout --detach "$sha"
          version="$(node -p 'require("./package.json").version')"
          test "$TAG" = "v$version"
          node -e '
            if (process.argv[1].includes("-"))
              throw new Error("release versions must not be prereleases");
          ' "$version"
          npm run release:check -- --allow-unreleased --tag "$TAG"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Build and verify package once
        id: package
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          package_dir="$RUNNER_TEMP/npm-package"
          mkdir "$package_dir"
          npm pack --pack-destination "$package_dir"
          tarball="$(node scripts/assert-one-tarball.mjs "$package_dir")"
          npm run package:verify -- "$tarball" \
            --receipt package-verification.json
          npm run --silent smoke:fresh-install -- "$tarball" \
            | tee fresh-install.log
          tail -n 1 fresh-install.log > fresh-install-receipt.json
          node -e '
            const receipt = require("./fresh-install-receipt.json");
            if (!receipt.cleanup?.packageRemoved ||
                !receipt.cleanup?.prefixRemoved ||
                !receipt.cleanup?.piHomeRemoved) process.exit(1);
          '
          integrity="$(node -p \
            'require("./package-verification.json").integrity')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package-${{ needs.metadata.outputs.sha }}
          path: |
            ${{ steps.package.outputs.tarball }}
            package-verification.json
            fresh-install-receipt.json
          if-no-files-found: error
          retention-days: 90

  image-candidate:
    needs: [metadata, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.runtime.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          persist-credentials: false
      - id: runtime
        name: Read the exact locked multi-platform runtime
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const lock = JSON.parse(await readFile("docker/image-lock.json"));
          const runtime = lock.images?.standard;
          if (runtime?.status !== "published" ||
              !/^ghcr\.io\/[^@]+@sha256:[0-9a-f]{64}$/.test(
                runtime.reference ?? "",
              ) ||
              JSON.stringify(runtime.platforms) !==
                JSON.stringify(["linux/amd64", "linux/arm64"]))
            throw new Error("standard runtime lock is not release-ready");
          console.log(`reference=${runtime.reference}`);
          console.log(`digest=${runtime.reference.split("@")[1]}`);
          NODE
      - name: Export the exact locked multi-platform runtime
        env:
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: |
          skopeo="quay.io/skopeo/stable@sha256:9c68e585103448f7e4abb835132ffe9759d7a962a0fa426035775956e7a1e021"
          docker run --rm --volume "$RUNNER_TEMP:/output" "$skopeo" copy \
            --all "docker://$RUNTIME_REFERENCE" \
            oci-archive:/output/candidate-image.oci.tar:candidate
      - name: Verify and receipt the locked runtime archive
        env:
          EXPECTED_DIGEST: ${{ steps.runtime.outputs.digest }}
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir oci
          tar -xf "$RUNNER_TEMP/candidate-image.oci.tar" -C oci index.json
          digest="$(node -p 'require("./oci/index.json").manifests[0].digest')"
          test "$digest" = "$EXPECTED_DIGEST"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          await writeFile("image-verification.json", `${JSON.stringify({
            sourceSha: process.env.SOURCE_SHA,
            ociDigest: process.env.EXPECTED_DIGEST,
            image: process.env.RUNTIME_REFERENCE,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-candidate-${{ needs.metadata.outputs.sha }}
          path: |
            ${{ runner.temp }}/candidate-image.oci.tar
            image-verification.json
          if-no-files-found: error
          retention-days: 90

  security:
    needs: [metadata, image-candidate]
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yml
    with:
      source_sha: ${{ needs.metadata.outputs.sha }}
      image_artifact: oci-candidate-${{ needs.metadata.outputs.sha }}
      image_digest: ${{ needs.image-candidate.outputs.digest }}

  e2e:
    needs: [metadata, package, image-candidate, security]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      source_sha: ${{ needs.metadata.outputs.sha }}
      package_artifact: npm-package-${{ needs.metadata.outputs.sha }}
      image_artifact: oci-candidate-${{ needs.metadata.outputs.sha }}
      image_digest: ${{ needs.image-candidate.outputs.digest }}

  receipt:
    needs: [metadata, package, image-candidate, security, e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package-${{ needs.metadata.outputs.sha }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: oci-candidate-${{ needs.metadata.outputs.sha }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-security-${{ needs.metadata.outputs.sha }}
          path: evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-arm64-e2e-${{ needs.metadata.outputs.sha }}
          path: evidence/macos-arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-amd64-kvm-e2e-${{ needs.metadata.outputs.sha }}
          path: evidence/ubuntu-amd64-kvm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ubuntu-arm64-kvm-e2e-${{ needs.metadata.outputs.sha }}
          path: evidence/ubuntu-arm64-kvm
      - name: Join and verify candidate evidence
        env:
          SOURCE_SHA: ${{ needs.metadata.outputs.sha }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image-candidate.outputs.digest }}
          SCAN_REF: ${{ needs.security.outputs.scan_ref }}
          SBOM_REF: ${{ needs.security.outputs.sbom_ref }}
          PROVENANCE_REF: oci-candidate-${{ needs.metadata.outputs.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const packageReceipt = JSON.parse(
            await readFile("evidence/package-verification.json"),
          );
          const imageReceipt = JSON.parse(
            await readFile("evidence/image-verification.json"),
          );
          const freshInstallReceipt = JSON.parse(
            await readFile("evidence/fresh-install-receipt.json"),
          );
          const imageLock = JSON.parse(
            await readFile("docker/image-lock.json"),
          );
          const hardware = [
            "macos-arm64",
            "ubuntu-amd64-kvm",
            "ubuntu-arm64-kvm",
          ];
          const e2eReceipts = [];
          for (const host of hardware) {
            const root = `evidence/${host}`;
            const e2e = JSON.parse(
              await readFile(`${root}/e2e-receipt.json`),
            );
            const cleanup = JSON.parse(
              await readFile(`${root}/cleanup-receipt.json`),
            );
            e2eReceipts.push({ host, ...e2e, cleanup });
          }
          const expected = process.env;
          const e2eReceipt = e2eReceipts[0];
          if (imageReceipt.sourceSha !== expected.SOURCE_SHA ||
              imageReceipt.ociDigest !== expected.IMAGE_DIGEST ||
              packageReceipt.binVersion !== expected.VERSION ||
              imageLock.piVersion !== "0.84.1" ||
              freshInstallReceipt.sourceSha !== expected.SOURCE_SHA ||
              freshInstallReceipt.version !== expected.VERSION ||
              freshInstallReceipt.integrity !== packageReceipt.integrity ||
              !freshInstallReceipt.cleanup?.packageRemoved ||
              !freshInstallReceipt.cleanup?.prefixRemoved ||
              !freshInstallReceipt.cleanup?.piHomeRemoved ||
              e2eReceipt.packageVersion !== expected.VERSION ||
              e2eReceipts.some((e2e) =>
                e2e.sourceSha !== expected.SOURCE_SHA ||
                e2e.candidateDigest !== expected.IMAGE_DIGEST ||
                e2e.packageVersion !== expected.VERSION ||
                e2e.packageIntegrity !== packageReceipt.integrity ||
                e2e.piVersion !== imageLock.piVersion ||
                e2e.imageLockPiVersion !== imageLock.piVersion ||
                e2e.status !== "passed" || !e2e.passedAt ||
                e2e.cleanup?.status !== "passed" ||
                e2e.cleanup?.homeRemoved !== true))
            throw new Error(
              "candidate evidence does not bind to one candidate",
            );
          const receipt = {
            sourceSha: expected.SOURCE_SHA,
            tag: expected.TAG,
            version: expected.VERSION,
            tarballIntegrity: packageReceipt.integrity,
            imageDigest: expected.IMAGE_DIGEST,
            scanRef: expected.SCAN_REF, sbomRef: expected.SBOM_REF,
            provenanceRef:
              `${expected.PROVENANCE_REF}#${expected.IMAGE_DIGEST}`,
            freshInstallReceipt,
            e2eReceipt,
            e2eReceipts,
          };
          await writeFile(
            "release-candidate-receipt.json",
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE
          cp evidence/candidate-image.cdx.json candidate-image.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-candidate-${{ needs.metadata.outputs.sha }}
          path: |
            release-candidate-receipt.json
            candidate-image.cdx.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 90

  publish-npm:
    needs: [metadata, receipt]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm.yml
    with:
      source_sha: ${{ needs.metadata.outputs.sha }}
      tag: ${{ inputs.tag }}
      package_artifact: npm-package-${{ needs.metadata.outputs.sha }}
      candidate_receipt: release-candidate-${{ needs.metadata.outputs.sha }}

  verify-publication:
    needs: [metadata, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
      - name: Verify npm and Pi package gallery availability
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          prefix="$(mktemp -d)"
          test "$(npm view "pi-docker-sandboxes" version)" = "$VERSION"
          npm install --ignore-scripts --prefix "$prefix" "pi-docker-sandboxes"
          installed="$prefix/node_modules/pi-docker-sandboxes/package.json"
          test "$(node -p 'require(process.argv[1]).version' "$installed")" \
            = "$VERSION"
          "$prefix/node_modules/.bin/pi-dsbx" --help
          gallery=https://pi.dev/packages/pi-docker-sandboxes
          for attempt in $(seq 1 20); do
            if page="$(curl --fail --silent --show-error "$gallery")" &&
              grep -F 'pi install npm:pi-docker-sandboxes' <<<"$page" &&
              grep -F "$VERSION" <<<"$page"; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Pi package gallery did not index $VERSION" >&2
              exit 1
            fi
            sleep 30
          done
