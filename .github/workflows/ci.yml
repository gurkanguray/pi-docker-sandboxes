name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Lint GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24.12.0"]
        pi: ["0.84.1", "0.84.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Bind exact Pi matrix version
        env:
          PI_VERSION: ${{ matrix.pi }}
          PI_TEST_VERSION: ${{ matrix.pi }}
        run: |
          npm install --ignore-scripts --no-save --package-lock=false \
            "@earendil-works/pi-ai@$PI_VERSION" \
            "@earendil-works/pi-agent-core@$PI_VERSION" \
            "@earendil-works/pi-coding-agent@$PI_VERSION" \
            "@earendil-works/pi-tui@$PI_VERSION"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const name of [
            "pi-ai",
            "pi-agent-core",
            "pi-coding-agent",
            "pi-tui",
          ]) {
            const path = `node_modules/@earendil-works/${name}/package.json`;
            const actual = JSON.parse(await readFile(path)).version;
            if (actual !== process.env.PI_VERSION)
              throw new Error(`${name}: ${actual}`);
          }
          NODE
      - run: npm run check
        env:
          PI_TEST_VERSION: ${{ matrix.pi }}

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage
      - run: npm audit --audit-level=high

  package-runtime-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - id: candidate
        name: Pack and verify the package
        run: |
          package_dir="$RUNNER_TEMP/npm-package"
          mkdir "$package_dir"
          npm pack --pack-destination "$package_dir"
          tarball="$(node scripts/assert-one-tarball.mjs "$package_dir")"
          npm run package:verify -- "$tarball" \
            --receipt package-verification.json
          npm run --silent smoke:fresh-install -- "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - id: runtime
        name: Read the exact locked runtime
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFile } from "node:fs/promises";
          const lock = JSON.parse(await readFile("docker/image-lock.json"));
          const runtime = lock.images?.standard;
          if (runtime?.status !== "published" ||
              !runtime.platforms?.includes(process.env.EXPECTED_PLATFORM))
            throw new Error("locked runtime does not support this platform");
          console.log(`reference=${runtime.reference}`);
          console.log(`pi_version=${lock.piVersion}`);
          NODE
        env:
          EXPECTED_PLATFORM: ${{ matrix.platform }}
      - name: Pull and smoke the native locked runtime
        env:
          PLATFORM: ${{ matrix.platform }}
          PI_VERSION: ${{ steps.runtime.outputs.pi_version }}
          RUNTIME_REFERENCE: ${{ steps.runtime.outputs.reference }}
        run: |
          docker pull --platform "$PLATFORM" "$RUNTIME_REFERENCE"
          docker image inspect "$RUNTIME_REFERENCE" \
            --format '{{json .RepoDigests}}' | grep -F "${RUNTIME_REFERENCE#*@}"
          docker run --rm --env PI_VERSION --entrypoint sh \
            "$RUNTIME_REFERENCE" -c '
            test "$(pi --version)" = "$PI_VERSION"
            test -x /opt/pi-runtime/node_modules/.bin/pi
            controller=/usr/local/share/npm-global/lib/node_modules
            test ! -e "$controller/pi-docker-sandboxes"
          '

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck and run platform-independent units
        run: |
          npx tsc --noEmit
          node --experimental-strip-types --test `
            test/config.test.ts `
            test/package.test.ts `
            test/platform.test.ts `
            test/runtime-extension.test.ts `
            test/workflows.test.ts
      - name: Build and pack on Windows
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          npx tsc --project tsconfig.cli.json
          npm pack --ignore-scripts
