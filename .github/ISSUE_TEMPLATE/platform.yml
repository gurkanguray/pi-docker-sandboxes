name: Platform report
description: Share sanitized behavior from a Docker Sandboxes and Pi host.
title: "[Platform]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Production support covers macOS 14+ on Apple Silicon.
        Ubuntu 24.04+ supports amd64 and arm64 with KVM.
        Windows 11 x64 is the next package milestone; it is not certified.
        Reports from other upstream-capable hosts are welcome; a report does
        not establish support or guarantee a roadmap commitment. Do not include
        credentials, private source, environment dumps, sessions, or patches.
  - type: input
    id: platform
    attributes:
      label: Host platform, version, and architecture
      description: >-
        For Ubuntu, also state whether the user can access `/dev/kvm`.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package, Pi, Node.js, Docker, and `sbx` versions
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Reviewed JSON diagnostics
      description: >-
        Paste redacted `pi-dsbx doctor --json` output. Remove private paths and
        project metadata.
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observed behavior
      description: Provide sanitized symptoms and minimal reproduction steps.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Safety and roadmap acknowledgement
      options:
        - label: >-
            I reviewed this report and removed credentials, private source,
            sessions, patches, and environment dumps.
          required: true
        - label: >-
            I understand this report does not establish support or guarantee a
            roadmap commitment.
          required: true
