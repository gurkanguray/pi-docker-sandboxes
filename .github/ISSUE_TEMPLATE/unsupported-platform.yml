name: Unsupported platform report
description: >-
  Share diagnostic evidence from an unsupported host.
title: "[Unsupported platform]: "
labels:
  - unsupported-platform
body:
  - type: markdown
    attributes:
      value: |
        Linux, Windows, non-ARM64 Macs, and unlisted versions are unsupported.
        Reports are welcome as diagnostic evidence, but filing a report does not
        imply support, establish a roadmap commitment, or guarantee a response.
        Do not include credentials, private source, environment dumps, or other
        sensitive data.
  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: Give concise OS and architecture versions only.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Package, Pi, Node.js, and `sbx` versions
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Observed behavior
      description: Provide sanitized symptoms and minimal reproduction steps.
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Support boundary acknowledgement
      options:
        - label: I understand this platform is unsupported during Early Access.
          required: true
