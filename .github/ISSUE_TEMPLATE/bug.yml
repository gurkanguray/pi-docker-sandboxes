name: Bug report
description: Report a reproducible problem in a documented workflow.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private source, raw environment dumps, or
        sensitive patch contents. Report undisclosed vulnerabilities through
        private vulnerability reporting instead.
  - type: input
    id: package_version
    attributes:
      label: Package version
      description: Version shown by `pi list` or your installation record.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: pi_version
    attributes:
      label: Pi version
      placeholder: 0.84.1
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      placeholder: 24.12.0
    validations:
      required: true
  - type: input
    id: sbx_version
    attributes:
      label: Docker Sandboxes (`sbx`) version
      placeholder: 0.38.x
    validations:
      required: true
  - type: input
    id: host_os
    attributes:
      label: Host OS name
      placeholder: macOS, Ubuntu, or Windows
    validations:
      required: true
  - type: input
    id: host_version
    attributes:
      label: Host OS version
      description: Give only the version number; do not paste system reports.
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: Architecture
      placeholder: arm64 or x64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List sanitized steps and commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include only sanitized errors and relevant output.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Reviewed `pi-dsbx doctor` output
      description: >-
        Paste only output you reviewed and redacted. Never include secrets,
        credentials, environment dumps, private source, or sensitive patches.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction confirmation
      options:
        - label: >-
            I reviewed and redacted all output and included no secrets,
            credentials, private source, or sensitive patch contents.
          required: true
